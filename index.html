<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;background:transparent;direction:rtl;font-family:sans-serif}

.w{
  border-radius:20px;
  border:1px solid #ffffff18;
  overflow:hidden;
  transition:background 2s ease;
}

/* خلفية كل صلاة */
.bg-fajr    { background:linear-gradient(160deg,#0d1b2a,#1a2a4a,#0a0f1e) }
.bg-sunrise { background:linear-gradient(160deg,#2d1b00,#c4622d,#e8a040) }
.bg-dhuhr   { background:linear-gradient(160deg,#0a2a4a,#1565a0,#1e88c8) }
.bg-asr     { background:linear-gradient(160deg,#1a2800,#3a5a00,#c8a020) }
.bg-maghrib { background:linear-gradient(160deg,#2a0a00,#8b2500,#e05020) }
.bg-isha    { background:linear-gradient(160deg,#050810,#0d1520,#121a2e) }
.bg-default { background:linear-gradient(160deg,#1a1f2e,#141820,#0f1318) }

.top{display:flex;padding:12px;gap:10px;align-items:stretch;min-height:130px}
.mbox{width:108px;flex-shrink:0;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px #00000050}
.mbox img{width:100%;height:100%;object-fit:cover;display:block}

.info{flex:1;display:flex;flex-direction:column;justify-content:space-between;text-align:right}

.dayname{
  font-family:'Amiri',serif;
  font-size:56px;
  font-weight:700;
  color:#f5e8d0;
  line-height:0.95;
  text-shadow:0 2px 16px #00000060;
}

.clk{
  font-size:19px;font-weight:700;
  color:#f0ddb0;
  direction:ltr;text-align:right;
  letter-spacing:1px;margin-top:3px;
  text-shadow:0 1px 6px #00000040;
}
.clkp{font-size:12px;color:#ffd080;font-weight:700;margin-right:3px}

.orn{
  display:flex;align-items:center;gap:5px;
  color:#ffd08099;font-size:9px;margin:4px 0;
}
.orn::before,.orn::after{content:'';flex:1;height:0.5px;background:#ffffff30}

.dates{display:flex;gap:5px;justify-content:flex-end}
.dp{
  background:#ffffff15;
  border:0.5px solid #ffffff25;
  border-radius:20px;padding:3px 8px;
  font-size:9px;color:#f0ddb0;font-weight:700;
  display:flex;align-items:center;gap:3px;white-space:nowrap;
  backdrop-filter:blur(4px);
}

.hdiv{height:0.5px;background:linear-gradient(90deg,transparent,#ffffff30,transparent);margin:0 12px}

.pgrid{display:flex;gap:5px;padding:8px 8px 10px}
.pc{
  flex:1;
  background:#ffffff0d;
  border:0.5px solid #ffffff20;
  border-radius:12px;
  padding:8px 3px 7px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  position:relative;overflow:hidden;
  backdrop-filter:blur(6px);
  transition:background 0.4s,border-color 0.4s;
}
.pc.act{
  background:#ffffff22;
  border-color:#ffd08088;
  box-shadow:0 0 14px #ffd08025;
}
.pc.act::before{
  content:'';position:absolute;top:0;left:15%;right:15%;height:2px;
  background:linear-gradient(90deg,transparent,#ffd080,transparent);
}
.pico{font-size:20px;line-height:1;margin-bottom:1px}
.pn{font-size:9.5px;color:#f0ddb0cc;font-weight:700}
.ps{color:#ffd08099;font-size:6px;margin:1px 0}
.pt{
  font-size:14px;font-weight:900;
  color:#f5e8d0;direction:ltr;
  font-variant-numeric:tabular-nums;line-height:1;
}
.pp{font-size:9px;color:#ffd080;font-weight:700}
.pc.act .pt{color:#ffd080}
</style>
</head>

function calcTimes(date){
  var TZ=-(date.getTimezoneOffset())/60;
  var y=date.getFullYear(),mo=date.getMonth()+1,d=date.getDate();
  var JD=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(mo+1))+d-1524.5
    +(mo<=2?(Math.floor(365.25*(y-1+4716))-Math.floor(365.25*(y+4716))):0)
    +(2-Math.floor(y/100)+Math.floor(Math.floor(y/100)/4));
  var DD=JD-2451545;
  var g=(357.529+0.98560028*DD)*Math.PI/180;
  var q=280.459+0.98564736*DD;
  var L=(q+1.915*Math.sin(g)+0.02*Math.sin(2*g))*Math.PI/180;
  var e=(23.439-0.00000036*DD)*Math.PI/180;
  var RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))*180/Math.PI/15;
  var dec=Math.asin(Math.sin(e)*Math.sin(L))*180/Math.PI;
  var fx=function(h){return h-24*Math.floor(h/24);};
  var EqT=q/15-fx(RA);
  var noon=12+TZ-(LNG/15)-EqT;
  function at(ang,rise){
    var c=(-Math.sin(ang*Math.PI/180)-Math.sin(LAT*Math.PI/180)*Math.sin(dec*Math.PI/180))
          /(Math.cos(LAT*Math.PI/180)*Math.cos(dec*Math.PI/180));
    if(Math.abs(c)>1)return null;
    var t=Math.acos(c)*180/Math.PI/15;
    return rise?noon-t:noon+t;
  }
  function asrt(){
    var a=Math.atan(1/(1+Math.tan(Math.abs(LAT-dec)*Math.PI/180)))*180/Math.PI;
    var c=(Math.sin(a*Math.PI/180)-Math.sin(LAT*Math.PI/180)*Math.sin(dec*Math.PI/180))
          /(Math.cos(LAT*Math.PI/180)*Math.cos(dec*Math.PI/180));
    if(Math.abs(c)>1)return null;
    return noon+Math.acos(c)*180/Math.PI/15;
  }
  function fm(h){
    if(h===null)return'--:--';
    h=fx(h);
    return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');
  }
  return{Fajr:fm(at(19.5,true)),Sunrise:fm(at(0.833,true)),Dhuhr:fm(noon),Asr:fm(asrt()),Maghrib:fm(at(0.833,false)),Isha:fm(at(17.5,false))};
}

function hijri(date){
  var d=date.getDate(),m=date.getMonth()+1,y=date.getFullYear();
  var jd=Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)
    +Math.floor((367*(m-2-12*Math.floor((m-14)/12)))/12)
    -Math.floor((3*Math.floor((y+4900+Math.floor((m-14)/12))/100))/4)+d-32075;
  var l=jd-1948440+10632,n2=Math.floor((l-1)/10631);
  l=l-10631*n2+354;
  var j=Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);
  l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;
  var hm=Math.floor((24*l)/709);
  return{d:l-Math.floor((709*hm)/24),m:hm,y:30*n2+j-30};
}

function f12(s){
  var p=s.split(':').map(Number),h=p[0],m=p[1];
  return{t:String(h%12||12).padStart(2,'0')+':'+String(m).padStart(2,'0'),p:h>=12?'م':'ص'};
}
function pd(s){var p=s.split(':').map(Number),d=new Date();d.setHours(p[0],p[1],0,0);return d;}

// تحديث الخلفية حسب الصلاة الحالية
function updateBg(timings){
  var now=new Date();
  var ts=KY.map(function(k){return timings[k]&&timings[k]!='--:--'?pd(timings[k]):null;});
  // الصلاة الحالية = آخر صلاة فات وقتها
  var cur='Isha';
  for(var i=0;i<KY.length;i++){
    if(ts[i]&&ts[i]<=now) cur=KY[i];
  }
  var w=document.getElementById('w');
  w.className='w '+(BG[cur]||'bg-default');
}

// ساعة
function tick(){
  var n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  document.getElementById('cl').textContent=String(h%12||12).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  document.getElementById('pr').textContent=h>=12?'م':'ص';
}
setInterval(tick,1000);tick();

// تواريخ
function dates(){
  var n=new Date();
  document.getElementById('dn').textContent=DAYS[n.getDay()];
  document.getElementById('gd').textContent=n.getDate()+' '+MG[n.getMonth()]+' '+n.getFullYear()+' م';
  var h=hijri(n);
  document.getElementById('hd').textContent=h.d+' '+MH[h.m-1]+' '+h.y+' هـ';
}
dates();
function midMs(){var n=new Date(),m=new Date(n);m.setHours(24,0,0,0);return m-n;}
setTimeout(function(){dates();setInterval(dates,86400000);},midMs());

// عرض الكروت
function render(tm){
  var now=new Date();
  var ts=KY.map(function(k){return tm[k]&&tm[k]!='--:--'?pd(tm[k]):null;});
  var ni=ts.findIndex(function(t){return t&&t>now;});
  if(ni<0)ni=0;
  document.getElementById('pg').innerHTML=KY.map(function(k,i){
    var f=f12(tm[k]||'00:00');
    return'<div class="pc'+(i===ni?' act':'')+'">'+
      '<div class="pico">'+IC[k]+'</div>'+
      '<div class="pn">'+NM[k]+'</div>'+
      '<div class="ps">◆</div>'+
      '<div class="pt">'+f.t+'</div>'+
      '<div class="pp">'+f.p+'</div>'+
      '</div>';
  }).join('');
  updateBg(tm);
  setTimeout(function(){render(tm);},60000);
}

// جيب من النت أولاً، لو فشل استخدم الحساب المحلي
function fetchTimes(){
  var now=new Date();
  fetch('https://api.aladhan.com/v1/timings/'+now.getDate()+'-'+(now.getMonth()+1)+'-'+now.getFullYear()+'?latitude='+LAT+'&longitude='+LNG+'&method=5')
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.code===200){
        var t={};
        KY.forEach(function(k){t[k]=data.data.timings[k].split(' ')[0];});
        render(t);
        // جدولة تحديث اليوم التالي
        var fajr=t['Fajr'].split(':').map(Number);
        var tomorrow=new Date();
        tomorrow.setDate(tomorrow.getDate()+1);
        tomorrow.setHours(fajr[0],fajr[1]+2,0,0);
        setTimeout(fetchTimes,tomorrow-new Date());
      }
    })
    .catch(function(){
      // استخدم الحساب المحلي لو النت مش شغال
      render(calcTimes(new Date()));
    });
}

fetchTimes();
setTimeout(function(){render(calcTimes(new Date()));setInterval(function(){render(calcTimes(new Date()));},86400000);},midMs());
</script>
