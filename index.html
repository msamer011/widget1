<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مواقيت الصلاة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; background: transparent; font-family: 'Cairo', sans-serif; direction: rtl; }

.widget {
  width: 100%;
  background: linear-gradient(160deg, #1a1f2e 0%, #141820 40%, #0f1318 100%);
  border-radius: 22px;
  border: 1px solid #2a2f3e;
  overflow: hidden;
  box-shadow: 0 8px 32px #00000080;
}

.top {
  display: flex;
  align-items: stretch;
  padding: 14px 14px 10px;
  gap: 10px;
  min-height: 135px;
}

.mosque-box {
  width: 113px;
  flex-shrink: 0;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
}
.mosque-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 14px;
}
.mosque-box::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #0f131808 0%, #0f131840 100%);
  border-radius: 14px;
  pointer-events: none;
}

.info-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: right;
  padding-top: 2px;
}

.day-name {
  font-family: 'Amiri', serif;
  font-size: 60px;
  font-weight: 700;
  color: #f5e8d0;
  line-height: 0.88;
  text-shadow: 0 2px 20px #c8830028;
}

.clock {
  font-size: 20px;
  font-weight: 700;
  color: #c8bfa8;
  direction: ltr;
  text-align: right;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  margin-top: 4px;
}
.clock .period {
  font-size: 12px;
  color: #c88300;
  font-weight: 700;
  margin-right: 4px;
}

.ornament-line {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 4px 0 5px;
  color: #c88300;
  font-size: 10px;
}
.ornament-line::before, .ornament-line::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: #c8830055;
}

.dates-row {
  display: flex;
  flex-direction: row;
  gap: 5px;
  justify-content: flex-end;
  align-items: center;
}

.date-pill {
  background: #1e2535;
  border: 0.5px solid #2e3d52;
  border-radius: 20px;
  padding: 3px 8px;
  font-size: 9.5px;
  color: #d0bf9a;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.pill-icon { font-size: 11px; }

.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #3a3a3a;
  display: inline-block;
  margin-right: 2px;
  vertical-align: middle;
  flex-shrink: 0;
}
.status-dot.online  { background: #4caf50; }
.status-dot.cached  { background: #c88300; }
.status-dot.error   { background: #e53935; }

.h-divider {
  height: 0.5px;
  background: linear-gradient(90deg, transparent 5%, #c8830055 50%, transparent 95%);
  margin: 0 12px;
}

.prayers-row {
  display: flex;
  gap: 6px;
  padding: 9px 9px 11px;
}

.p-card {
  flex: 1;
  background: #1c2232;
  border: 0.5px solid #2a3448;
  border-radius: 14px;
  padding: 8px 3px 7px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  position: relative;
  overflow: hidden;
}

.p-card.active {
  background: #1b2a1e;
  border-color: #c8830060;
  box-shadow: 0 0 12px #c8830014;
}
.p-card.active::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #c88300, transparent);
  border-radius: 0 0 2px 2px;
}

.p-name { font-size: 10px; color: #a89e84; font-weight: 700; }
.p-sep  { color: #c88300; font-size: 7px; margin: 1px 0; }
.p-time {
  font-size: 14px; font-weight: 900;
  color: #f0e2c0; direction: ltr;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.p-period { font-size: 9px; color: #c88300; font-weight: 700; direction: rtl; }
.p-card.active .p-time { color: #f5c040; }

.loading { text-align:center; padding:16px; color:#6a7888; font-size:12px; flex:1; }
</style>
</head>

<script>
const ICONS = {
  Fajr:    'emoji:🌙',
  Sunrise: 'emoji:🌅',
  Dhuhr:   'emoji:☀️',
  Asr:     'emoji:⛅',
  Maghrib: 'emoji:🌇',
  Isha:    'emoji:🌑'
};

const NAMES = {Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
const KEYS  = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
const DAYS  = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MG    = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MH    = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

const STORAGE_KEY = 'prayer_cache_kafr';

function hijri(date) {
  const d=date.getDate(),m=date.getMonth()+1,y=date.getFullYear();
  let jd=Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)
    +Math.floor((367*(m-2-12*Math.floor((m-14)/12)))/12)
    -Math.floor((3*Math.floor((y+4900+Math.floor((m-14)/12))/100))/4)+d-32075;
  let l=jd-1948440+10632,n2=Math.floor((l-1)/10631);
  l=l-10631*n2+354;
  let j=Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)
    +Math.floor(l/5670)*Math.floor((43*l)/15238);
  l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)
    -Math.floor(j/16)*Math.floor((15238*j)/43)+29;
  const hm=Math.floor((24*l)/709);
  return {d:l-Math.floor((709*hm)/24),m:hm,y:30*n2+j-30};
}

function parseDt(s) {
  const [h,m]=s.split(':').map(Number),d=new Date();
  d.setHours(h,m,0,0); return d;
}

function format12(h,m) {
  return {
    time:`${String(h%12||12).padStart(2,'0')}:${String(m).padStart(2,'0')}`,
    period:h>=12?'م':'ص'
  };
}

function iconHtml(key) {
  const v=ICONS[key];
  if(v.startsWith('img:'))
    return `<img style="width:36px;height:36px;border-radius:8px;object-fit:cover;display:block;margin:0 auto 2px" src="${v.slice(4)}" alt=""/>`;
  return `<span style="font-size:22px;line-height:1;display:block;margin-bottom:2px">${v.slice(6)}</span>`;
}

// ── Clock — RAM only, no network ──
function tickClock() {
  const now=new Date(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  document.getElementById('clock').textContent=
    `${String(h%12||12).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('period').textContent=h>=12?'م':'ص';
}
setInterval(tickClock,1000);
tickClock();

// ── Dates — RAM only ──
function setDates() {
  const now=new Date();
  document.getElementById('dayName').textContent=DAYS[now.getDay()];
  document.getElementById('gregDate').textContent=`${now.getDate()} ${MG[now.getMonth()]} ${now.getFullYear()} م`;
  const h=hijri(now);
  document.getElementById('hijriDate').textContent=`${h.d} ${MH[h.m-1]} ${h.y} هـ`;
}
setDates();
function msToMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);return m-n;}
setTimeout(()=>{setDates();setInterval(setDates,86400000);},msToMidnight());

// ── Status dot ──
function setStatus(s){document.getElementById('statusDot').className='status-dot '+s;}

// ── Render ──
function render(timings) {
  const now=new Date();
  const times=KEYS.map(k=>timings[k]?parseDt(timings[k].split(' ')[0]):null);
  let ni=times.findIndex(t=>t&&t>now);
  if(ni===-1)ni=0;
  document.getElementById('prayersRow').innerHTML=KEYS.map((k,i)=>{
    const raw=timings[k]?.split(' ')[0]||'00:00';
    const[hh,mm]=raw.split(':').map(Number);
    const{time,period}=format12(hh,mm);
    return`<div class="p-card ${i===ni?'active':''}">
      ${iconHtml(k)}
      <div class="p-name">${NAMES[k]}</div>
      <div class="p-sep">◆</div>
      <div class="p-time">${time}</div>
      <div class="p-period">${period}</div>
    </div>`;
  }).join('');
  setTimeout(()=>render(timings),60000);
}

// ── Cache ──
function todayKey(){const n=new Date();return`${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()}`;}
function saveCache(t){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({date:todayKey(),timings:t}));}catch(e){}}
function loadCache(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return null;
    const obj=JSON.parse(raw);
    if(obj.date===todayKey())return obj.timings;
  }catch(e){}
  return null;
}

// ── Fetch — كفر الشيخ بالإحداثيات ──
function scheduleNextFetch(timings) {
  const fajrRaw=timings['Fajr']?.split(' ')[0];
  if(!fajrRaw){setTimeout(fetchAndCache,86400000);return;}
  const[fh,fm]=fajrRaw.split(':').map(Number);
  const tomorrow=new Date();
  tomorrow.setDate(tomorrow.getDate()+1);
  tomorrow.setHours(fh,fm+1,0,0);
  const ms=tomorrow-new Date();
  console.log(`Next fetch in ${Math.round(ms/60000)} min`);
  setTimeout(fetchAndCache,ms);
}

async function fetchAndCache() {
  const now=new Date();
  try {
    const url=`https://api.aladhan.com/v1/timings/${now.getDate()}-${now.getMonth()+1}-${now.getFullYear()}?latitude=31.1107&longitude=30.9388&method=5`;
    const res=await fetch(url);
    const data=await res.json();
    if(data.code===200){
      saveCache(data.data.timings);
      setStatus('online');
      render(data.data.timings);
      scheduleNextFetch(data.data.timings);
    } else throw 0;
  } catch{
    setStatus('error');
    setTimeout(fetchAndCache,600000);
  }
}

// ── Init ──
(function(){
  const cached=loadCache();
  if(cached){
    setStatus('cached');
    render(cached);
    scheduleNextFetch(cached);
  } else {
    setStatus('error');
    fetchAndCache();
  }
})();
</script>
