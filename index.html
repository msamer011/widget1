<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مواقيت الصلاة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; background: transparent; font-family: 'Cairo', sans-serif; direction: rtl; }

.widget {
  width: 100%;
  background: linear-gradient(160deg, #1a1f2e 0%, #141820 40%, #0f1318 100%);
  border-radius: 22px;
  border: 1px solid #2a2f3e;
  overflow: hidden;
  box-shadow: 0 8px 32px #00000080;
}

.top {
  display: flex;
  align-items: stretch;
  padding: 16px 16px 10px;
  gap: 10px;
  min-height: 155px;
}

.mosque-box {
  width: 125px;
  flex-shrink: 0;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 90%, #c8830018 0%, transparent 65%);
}
.mosque-box svg { width: 125px; display: block; }

.info-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: right;
  padding-top: 4px;
}

.day-name {
  font-family: 'Amiri', serif;
  font-size: 70px;
  font-weight: 700;
  color: #f5e8d0;
  line-height: 0.88;
  text-shadow: 0 2px 20px #c8830028;
}

.ornament-line {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 5px 0 8px;
  color: #c88300;
  font-size: 10px;
}
.ornament-line span { letter-spacing: 3px; }
.ornament-line::before, .ornament-line::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: #c8830055;
}

.dates-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: flex-end;
}

.date-pill {
  background: #1e2535;
  border: 0.5px solid #2e3d52;
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 10.5px;
  color: #d0bf9a;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.pill-icon { font-size: 12px; }

.h-divider {
  height: 0.5px;
  background: linear-gradient(90deg, transparent 5%, #c8830055 50%, transparent 95%);
  margin: 0 12px;
}

/* ── PRAYERS ROW ── */
.prayers-row {
  display: flex;
  gap: 6px;
  padding: 10px 10px 12px;
}

.p-card {
  flex: 1;
  background: #1c2232;
  border: 0.5px solid #2a3448;
  border-radius: 16px;
  padding: 10px 4px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  position: relative;
}

.p-card.active {
  background: #1b2a1e;
  border-color: #c8830060;
  box-shadow: 0 0 12px #c8830014;
}
.p-card.active::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #c88300, transparent);
  border-radius: 0 0 2px 2px;
}

.p-icon { font-size: 20px; line-height: 1; margin-bottom: 1px; }
.p-name { font-size: 10.5px; color: #a89e84; font-weight: 700; }
.p-sep { color: #c88300; font-size: 7px; margin: 1px 0; }
.p-time {
  font-size: 16px; font-weight: 900;
  color: #f0e2c0; direction: ltr;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.3px;
  line-height: 1;
}
.p-card.active .p-time { color: #f5c040; }

.loading { text-align:center; padding:20px; color:#6a7888; font-size:12px; flex:1; }
</style>
</head>
<body>
<div class="widget">

  <div class="top">
    <!-- Mosque -->
    <div class="mosque-box">
      <svg viewBox="0 0 125 165" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="g1" cx="50%" cy="90%" r="75%">
            <stop offset="0%" stop-color="#c88300" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#0f1318" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="g2" cx="50%" cy="10%" r="90%">
            <stop offset="0%" stop-color="#c88300" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#c88300" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="125" height="165" fill="url(#g1)"/>

        <!-- Stars -->
        <circle cx="90" cy="16" r="1.1" fill="#f5e6c8" opacity="0.85"/>
        <circle cx="103" cy="28" r="0.75" fill="#f5e6c8" opacity="0.6"/>
        <circle cx="80" cy="32" r="0.65" fill="#f5e6c8" opacity="0.5"/>
        <circle cx="14" cy="20" r="0.9" fill="#f5e6c8" opacity="0.6"/>
        <circle cx="26" cy="36" r="0.65" fill="#f5e6c8" opacity="0.45"/>
        <circle cx="46" cy="13" r="0.75" fill="#f5e6c8" opacity="0.5"/>
        <line x1="90" y1="13" x2="90" y2="19" stroke="#f5e6c8" stroke-width="0.4" opacity="0.45"/>
        <line x1="87" y1="16" x2="93" y2="16" stroke="#f5e6c8" stroke-width="0.4" opacity="0.45"/>

        <!-- Moon -->
        <circle cx="105" cy="24" r="13" fill="#d4a83a" opacity="0.9"/>
        <circle cx="111" cy="20" r="10.5" fill="#141820"/>
        <circle cx="105" cy="24" r="17" fill="none" stroke="#c88300" stroke-opacity="0.12" stroke-width="2"/>

        <!-- Arch sides -->
        <path d="M2 130 Q2 86 24 70 L24 130 Z" fill="#0c1520" stroke="#1e3050" stroke-width="0.5"/>
        <path d="M123 130 Q123 86 101 70 L101 130 Z" fill="#0c1520" stroke="#1e3050" stroke-width="0.5"/>
        <path d="M24 70 Q62.5 40 101 70" fill="none" stroke="#1e3050" stroke-width="0.5"/>

        <!-- Left minaret -->
        <rect x="12" y="73" width="12" height="50" rx="2" fill="#0e1b2c" stroke="#192e46" stroke-width="0.5"/>
        <path d="M12 73 Q18 57 24 73Z" fill="#13223a" stroke="#192e46" stroke-width="0.5"/>
        <rect x="16" y="53" width="4" height="8" fill="#0e1b2c" stroke="#192e46" stroke-width="0.5"/>
        <path d="M18 45 Q20.5 50 18 53 Q15.5 50 18 45Z" fill="#c88300" opacity="0.82"/>
        <rect x="9" y="95" width="18" height="2" rx="1" fill="#192e46"/>
        <rect x="14" y="79" width="8" height="9" rx="3" fill="#c8830010" stroke="#c8830028" stroke-width="0.5"/>

        <!-- Right minaret -->
        <rect x="101" y="73" width="12" height="50" rx="2" fill="#0e1b2c" stroke="#192e46" stroke-width="0.5"/>
        <path d="M101 73 Q107 57 113 73Z" fill="#13223a" stroke="#192e46" stroke-width="0.5"/>
        <rect x="105" y="53" width="4" height="8" fill="#0e1b2c" stroke="#192e46" stroke-width="0.5"/>
        <path d="M107 45 Q109.5 50 107 53 Q104.5 50 107 45Z" fill="#c88300" opacity="0.82"/>
        <rect x="98" y="95" width="18" height="2" rx="1" fill="#192e46"/>
        <rect x="103" y="79" width="8" height="9" rx="3" fill="#c8830010" stroke="#c8830028" stroke-width="0.5"/>

        <!-- Main dome -->
        <path d="M40 115 Q40 63 62.5 56 Q85 63 85 115 Z" fill="#111d2e" stroke="#192e46" stroke-width="0.5"/>
        <path d="M52 115 Q52 72 62.5 65" fill="none" stroke="#1c2e46" stroke-width="0.3"/>
        <path d="M73 115 Q73 72 62.5 65" fill="none" stroke="#1c2e46" stroke-width="0.3"/>
        <!-- Dome base -->
        <rect x="36" y="114" width="53" height="7" rx="2" fill="#172536" stroke="#192e46" stroke-width="0.5"/>
        <!-- Finial -->
        <rect x="60.5" y="51" width="4" height="9" fill="#c88300" opacity="0.88"/>
        <path d="M62.5 43 Q65.5 48 62.5 51 Q59.5 48 62.5 43Z" fill="#c88300"/>
        <circle cx="62.5" cy="41" r="4.5" fill="#c88300" opacity="0.45"/>
        <circle cx="64.8" cy="39.2" r="3.5" fill="#141820"/>
        <!-- Dome window -->
        <rect x="55" y="87" width="15" height="17" rx="6" fill="#c8830012" stroke="#c8830032" stroke-width="0.5"/>
        <rect x="58" y="90" width="9" height="11" rx="4" fill="#c8830020"/>

        <!-- Side small domes -->
        <path d="M36 115 Q36 104 44 101 Q52 104 52 115Z" fill="#0f1c2e" stroke="#192e46" stroke-width="0.5"/>
        <rect x="42" y="98" width="3" height="5" fill="#c88300" opacity="0.48"/>
        <path d="M73 115 Q73 104 81 101 Q89 104 89 115Z" fill="#0f1c2e" stroke="#192e46" stroke-width="0.5"/>
        <rect x="79" y="98" width="3" height="5" fill="#c88300" opacity="0.48"/>

        <!-- Ground -->
        <rect x="0" y="120" width="125" height="45" fill="#0b1320"/>
        <rect x="4" y="120" width="117" height="1.5" rx="0.75" fill="#192e46"/>
        <rect x="28" y="122" width="69" height="7" rx="3.5" fill="url(#g2)"/>

        <!-- Base arches/windows -->
        <rect x="26" y="106" width="10" height="8" rx="3" fill="#c8830010" stroke="#c8830022" stroke-width="0.5"/>
        <rect x="89" y="106" width="10" height="8" rx="3" fill="#c8830010" stroke="#c8830022" stroke-width="0.5"/>

        <!-- Glow dots (lanterns) -->
        <circle cx="24" cy="74" r="2.5" fill="#c8830022"/>
        <circle cx="101" cy="74" r="2.5" fill="#c8830022"/>
        <circle cx="62.5" cy="57" r="2" fill="#c8830028"/>
      </svg>
    </div>

    <!-- Info -->
    <div class="info-block">
      <div class="day-name" id="dayName">الأحد</div>
      <div class="ornament-line"><span>❧</span></div>
      <div class="dates-row">
        <div class="date-pill">
          <span class="pill-icon">📅</span>
          <span id="gregDate">—</span>
        </div>
        <div class="date-pill">
          <span class="pill-icon">🌙</span>
          <span id="hijriDate">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="h-divider"></div>

  <!-- Prayers -->
  <div class="prayers-row" id="prayersRow">
    <div class="loading">جاري تحميل المواقيت...</div>
  </div>

</div>
<script>
const NAMES={Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
const ICONS={Fajr:'🌙',Sunrise:'🌅',Dhuhr:'☀️',Asr:'⛅',Maghrib:'🌇',Isha:'🌑'};
const KEYS=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MG=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MH=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

function hijri(date){
  const d=date.getDate(),m=date.getMonth()+1,y=date.getFullYear();
  let jd=Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)+Math.floor((367*(m-2-12*Math.floor((m-14)/12)))/12)-Math.floor((3*Math.floor((y+4900+Math.floor((m-14)/12))/100))/4)+d-32075;
  let l=jd-1948440+10632,n2=Math.floor((l-1)/10631);
  l=l-10631*n2+354;
  let j=Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);
  l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;
  const hm=Math.floor((24*l)/709);
  return{d:l-Math.floor((709*hm)/24),m:hm,y:30*n2+j-30};
}
function parseDt(s){const[h,m]=s.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d;}
function setDates(){
  const now=new Date();
  document.getElementById('dayName').textContent=DAYS[now.getDay()];
  document.getElementById('gregDate').textContent=`${now.getDate()} ${MG[now.getMonth()]} ${now.getFullYear()} م`;
  const h=hijri(now);
  document.getElementById('hijriDate').textContent=`${h.d} ${MH[h.m-1]} ${h.y} هـ`;
}
function render(timings){
  const now=new Date();
  const times=KEYS.map(k=>timings[k]?parseDt(timings[k].split(' ')[0]):null);
  let nextIdx=times.findIndex((t,i)=>t&&t>now);
  if(nextIdx===-1)nextIdx=0;
  document.getElementById('prayersRow').innerHTML=KEYS.map((k,i)=>{
    const raw=timings[k]?.split(' ')[0]||'--:--';
    const[hh,mm]=raw.split(':').map(Number);
    const active=i===nextIdx;
    return`<div class="p-card ${active?'active':''}">
      <span class="p-icon">${ICONS[k]}</span>
      <div class="p-name">${NAMES[k]}</div>
      <div class="p-sep">◆</div>
      <div class="p-time">${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}</div>
    </div>`;
  }).join('');
}
async function load(){
  setDates();
  try{
    const now=new Date();
    const r=await fetch(`https://api.aladhan.com/v1/timingsByCity/${now.getDate()}-${now.getMonth()+1}-${now.getFullYear()}?city=Cairo&country=Egypt&method=5`);
    const data=await r.json();
    if(data.code===200)render(data.data.timings);
    else throw 0;
  }catch{document.getElementById('prayersRow').innerHTML='<div class="loading">تعذّر تحميل المواقيت</div>';}
}
load();
setInterval(load,3600000);
</script>
</body>
</html>
